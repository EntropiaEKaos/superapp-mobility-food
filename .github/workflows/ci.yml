name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run check
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-only-for-ci-32-chars-xx
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-only-for-ci-32-chars-xx
      - name: Smoke test (demo mode, no payments or database)
        run: node scripts/smoke.mjs
      - name: Supervisor crash/restart/shutdown smoke
        run: node scripts/supervisor-smoke.mjs

  postgres-integration:
    name: PostgreSQL + Auth integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superapp_ci
          POSTGRES_PASSWORD: superapp_ci_password
          POSTGRES_DB: superapp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U superapp_ci -d superapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://superapp_ci:superapp_ci_password@127.0.0.1:5432/superapp_ci?schema=public
      BETTER_AUTH_SECRET: local-ci-test-secret-only-32-chars-123456
      BETTER_AUTH_URL: http://localhost:3188
      NEXT_PUBLIC_APP_URL: http://localhost:3188
      ENABLE_SANDBOX_DISPATCH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply versioned migrations
        run: npm run db:deploy
      - name: Verify database matches Prisma schema
        run: npm exec -w @superapp/database -- prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Build web app for integration test
        run: npm run build
      - name: Verify token-guarded monitoring, alerts and degraded database
        env:
          SANDBOX_MONITOR_TOKEN: local-ci-monitor-only-0123456789-ABCDEFG
        run: node scripts/sandbox-monitor-smoke.mjs
      - name: Verify sign-up, sessions, roles and PostgreSQL
        run: node scripts/auth-db-smoke.mjs


  redis-integration:
    name: PostgreSQL + Redis broker integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superapp_ci
          POSTGRES_PASSWORD: superapp_ci_password
          POSTGRES_DB: superapp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U superapp_ci -d superapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://superapp_ci:superapp_ci_password@127.0.0.1:5432/superapp_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: local-ci-test-secret-only-32-chars-123456
      BETTER_AUTH_URL: http://localhost:3189
      NEXT_PUBLIC_APP_URL: http://localhost:3189
      ENABLE_SANDBOX_DISPATCH: 'true'
      SANDBOX_EVENT_TRANSPORT: redis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply versioned migrations
        run: npm run db:deploy
      - name: Build Next.js for Redis test
        run: npm run build
      - name: Check Redis/PostgreSQL sandbox infrastructure prerequisites
        run: node scripts/sandbox-infra-preflight.mjs
      - name: Verify monitoring with Redis worker and webhook alert
        env:
          SANDBOX_MONITOR_TOKEN: local-ci-monitor-only-0123456789-ABCDEFG
        run: node scripts/sandbox-monitor-smoke.mjs
      - name: Verify PostgreSQL bridge, Redis PubSub, SSE reconnect and capacity
        run: node scripts/redis-bridge-smoke.mjs
      - name: Verify durable outbox, rollback isolation and broker recovery
        run: node scripts/outbox-recovery-smoke.mjs
      - name: Verify retry, dead-letter, retention and concurrent-worker load
        run: node scripts/outbox-retry-smoke.mjs
      - name: Verify circuit breaker trip and durable restart recovery
        run: node scripts/broker-circuit-smoke.mjs
      - name: Benchmark 240 sandbox writes with four workers and p50/p95
        run: node scripts/outbox-benchmark-smoke.mjs

  homologation-e2e:
    name: Homologation — customer/admin end-to-end + QA report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superapp_ci
          POSTGRES_PASSWORD: superapp_ci_password
          POSTGRES_DB: superapp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U superapp_ci -d superapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      DATABASE_URL: postgresql://superapp_ci:superapp_ci_password@127.0.0.1:5432/superapp_ci?schema=public
      BETTER_AUTH_SECRET: local-ci-test-secret-only-32-chars-123456
      BETTER_AUTH_URL: http://127.0.0.1:3191
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3191
      ENABLE_SANDBOX_DISPATCH: 'true'
      SANDBOX_EVENT_TRANSPORT: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply versioned migrations
        run: npm run db:deploy
      - name: Build web app
        run: npm run build
      - name: Run isolated customer/admin homologation journeys
        run: node scripts/homologation-journey.mjs
      - name: Attach QA report (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint18-homologation-qa
          path: artifacts/homologation/
          if-no-files-found: warn
          retention-days: 14
